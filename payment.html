<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - COE Past Questions</title>

  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #0645ad;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      background: #0645ad;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.98);
    }

    .methods {
      margin-top: 20px;
      padding: 12px;
      background: #eef4ff;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>COE Past Questions</h1>

  <p style="text-align:center;">
    Complete your payment to access the past questions.
  </p>

  <label>Full Name</label>
  <input type="text" id="name" placeholder="Enter your full name">

  <label>Email Address</label>
  <input type="email" id="email" placeholder="Enter your email">

  <label>Phone Number</label>
  <input type="tel" id="phone" placeholder="e.g. 0241234567">

  <label>Select Payment Method</label>
  <select id="method">
    <option value="card">Card</option>
    <option value="mobile_money">Mobile Money</option>
  </select>

  <div class="methods">
    💳 Card &nbsp; | &nbsp; 📱 Mobile Money
  </div>

  <button onclick="payNow()">Pay GH₵10.00</button>

</div>

<script>
function payNow() {

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const method = document.getElementById("method").value;

  if (!name || !email || !phone) {
    alert("Please fill in all the required information.");
    return;
  }

  const handler = PaystackPop.setup({
    key: "pk_test_5e7d4811cc33177b79c055fe63e0c5b0a73bb993",

    email: email,

    amount: 1000,

    currency: "GHS",

    channels: method === "mobile_money"
      ? ["mobile_money"]
      : ["card"],

    metadata: {
      custom_fields: [
        {
          display_name: "Full Name",
          variable_name: "full_name",
          value: name
        },
        {
          display_name: "Phone Number",
          variable_name: "phone_number",
          value: phone
        }
      ]
    },

    callback: function(response) {
      alert(
        "Payment successful!\n\nReference: " +
        response.reference
      );

      window.location.href = "past-questions.html";
    },

    onClose: function() {
      alert("Payment window closed.");
    }
  });

  handler.openIframe();
}
</script>

</body>
</html>
