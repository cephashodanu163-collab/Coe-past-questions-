<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - COE Past Questions</title>

  <script src="https://js.paystack.co/v1/inline.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #0645ad;
    }

    .selection {
      background: #eef4ff;
      padding: 15px;
      border-radius: 10px;
      line-height: 1.8;
      margin: 20px 0;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      background: #0645ad;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🔐 Payment</h1>

  <p style="text-align:center;">
    Confirm the past question you selected.
  </p>

  <div class="selection">
    <strong>College:</strong> <span id="college"></span><br>
    <strong>Level:</strong> <span id="level"></span><br>
    <strong>Course:</strong> <span id="course"></span><br>
    <strong>Year:</strong> <span id="year"></span>
  </div>

  <label>Full Name</label>
  <input type="text" id="name" placeholder="Enter your full name">

  <label>Email Address</label>
  <input type="email" id="email" placeholder="Enter your email">

  <label>Phone Number</label>
  <input type="tel" id="phone" placeholder="e.g. 0241234567">

  <label>Payment Method</label>
  <select id="method">
    <option value="card">Card</option>
    <option value="mobile_money">Mobile Money</option>
  </select>

  <button onclick="payNow()">PAY GH₵10.00</button>

</div>

<script>

  // Get the student's selection
  const college = localStorage.getItem("college");
  const level = localStorage.getItem("level");
  const course = localStorage.getItem("course");
  const year = localStorage.getItem("year");

  // Display the selection
  document.getElementById("college").textContent = college || "Not selected";
  document.getElementById("level").textContent = level || "Not selected";
  document.getElementById("course").textContent = course || "Not selected";
  document.getElementById("year").textContent = year || "Not selected";


  function payNow() {

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const method = document.getElementById("method").value;

    if (!name || !email || !phone) {
      alert("Please fill in your name, email and phone number.");
      return;
    }

    const handler = PaystackPop.setup({

      key: "pk_test_5e7d4811cc33177b79c055fe63e0c5b0a73bb993",

      email: email,

      amount: 1000,

      currency: "GHS",

      channels: method === "mobile_money"
        ? ["mobile_money"]
        : ["card"],

      metadata: {

        custom_fields: [

          {
            display_name: "Full Name",
            variable_name: "full_name",
            value: name
          },

          {
            display_name: "Phone Number",
            variable_name: "phone_number",
            value: phone
          },

          {
            display_name: "College",
            variable_name: "college",
            value: college
          },

          {
            display_name: "Level",
            variable_name: "level",
            value: level
          },

          {
            display_name: "Course",
            variable_name: "course",
            value: course
          },

          {
            display_name: "Year",
            variable_name: "year",
            value: year
          }

        ]

      },

      callback: function(response) {

        // Remember that payment was completed
        localStorage.setItem("paymentSuccessful", "true");
        localStorage.setItem("paymentReference", response.reference);

        alert(
          "Payment successful!\n\nReference: " +
          response.reference
        );

        // Return to the past questions page
        window.location.href = "past-questions.html";

      },

      onClose: function() {
        alert("Payment window closed.");
      }

    });

    handler.openIframe();

  }

</script>

</body>
</html>
