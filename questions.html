<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Questions</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f7ff;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #123c69;
    }

    select, button {
      width: 90%;
      max-width: 400px;
      padding: 14px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #aaa;
    }

    button {
      background: #123c69;
      color: white;
      border: none;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
    }

    a {
      display: inline-block;
      padding: 15px 20px;
      background: #198754;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>📚 Colleges Past Questions</h1>

  <select id="college">
    <option value="">Select College</option>
    <option>Presbyterian College of Education</option>
    <option>Komenda College of Education</option>
    <option>Accra College of Education</option>
    <option>OLA College of Education</option>
    <option>Foso College of Education</option>
    <option>Other College</option>
  </select>

  <select id="level">
    <option value="">Select Level</option>
    <option>Level 100</option>
    <option>Level 200</option>
    <option>Level 300</option>
    <option>Level 400</option>
  </select>

  <select id="course">
    <option value="">Select Course</option>
    <option>African Studies</option>
    <option>English Language</option>
    <option>Mathematics</option>
    <option>Science</option>
    <option>Social Studies</option>
    <option>ICT</option>
    <option>Education</option>
  </select>

  <br>

  <button onclick="loadQuestions()">View Past Questions</button>

  <div id="result"></div>

  <script>
    function loadQuestions() {

      const course = document.getElementById("course").value;
      const result = document.getElementById("result");

      if (course === "") {
        result.innerHTML = "<p>Please select a course first.</p>";
        return;
      }

      if (course === "African Studies") {

        result.innerHTML = `
          <h2>African Studies Past Questions</h2>

          <p>Your past question is ready.</p>

          <a href="https://drive.google.com/file/d/1hR5t5LXIj6X1WG8ckGt0iOy8YRgMIXG4/view"
             target="_blank">
             📄 Open African Studies Past Questions
          </a>
        `;

      } else {

        result.innerHTML = `
          <h2>${course}</h2>
          <p>Past questions for this course will be added soon.</p>
        `;
      }
    }
  </script>

</body>
</html>
