<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f6ff;
      text-align: center;
      padding: 50px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      color: #008000;
    }

    .details {
      background: #eef5ff;
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      text-align: left;
    }

    button {
      background: #003b7a;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>✅ Payment Successful!</h1>

    <p>Thank you for your payment.</p>

    <div class="details">
      <p><strong>College:</strong> <span id="college"></span></p>
      <p><strong>Level:</strong> <span id="level"></span></p>
      <p><strong>Course:</strong> <span id="course"></span></p>
      <p><strong>Year:</strong> <span id="year"></span></p>
    </div>

    <p>Your selected past question is ready.</p>

    <button onclick="openQuestions()">
      ACCESS PAST QUESTIONS
    </button>

  </div>

  <script>
    document.getElementById("college").textContent =
      localStorage.getItem("college") || "";

    document.getElementById("level").textContent =
      localStorage.getItem("level") || "";

    document.getElementById("course").textContent =
      localStorage.getItem("course") || "";

    document.getElementById("year").textContent =
      localStorage.getItem("year") || "";

    function openQuestions() {
      window.location.href = "questions.html";
    }
  </script>

</body>
</html>
